<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>崔天一 | Cui Tianyi</title>
<link rel="canonical" href="https://ccccty.github.io/resume/">
<meta http-equiv="refresh" content="0; url=https://ccccty.github.io/resume/">
<link rel="icon" type="image/png" sizes="32x32" href="https://ccccty.github.io/resume/assets/img/avatar-32.png">
<style>
  :root { --accent:#1b4b8f; --text:#1a1d23; --mute:#6b7280; --line:#e2e6ee; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f7f9fc; color: var(--text); padding: 24px;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", -apple-system, sans-serif;
  }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 34px 38px; max-width: 460px; width: 100%; text-align: center;
    box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: .04em; }
  p { margin: 0 0 20px; color: var(--mute); font-size: 14.5px; line-height: 1.7; }
  a.btn {
    display: inline-block; padding: 11px 22px; border-radius: 9px;
    background: var(--accent); color: #fff; text-decoration: none; font-size: 14.5px; font-weight: 600;
  }
  a.btn:hover { background: #163c72; }
  .hint { margin: 16px 0 0; font-size: 12.5px; color: #9aa3b2; }
</style>
</head>
<body>
  <main class="card">
    <h1>崔天一 · Cui Tianyi</h1>
    <p>正在跳转到个人主页。<br>Redirecting to the personal homepage.</p>
    <a class="btn" href="https://ccccty.github.io/resume/">进入主页 / Enter</a>
    <p class="hint">若未自动跳转，请点击上方按钮。</p>
  </main>
  <script>location.replace("https://ccccty.github.io/resume/");</script>
</body>
</html>
